name = "charme-pagamentos"
main = "src/index.js"
compatibility_date = "2025-09-01"

# a rota workers.dev fica DESLIGADA: o webhook_url é gravado por link e não pode ser editado, então só o domínio próprio é usado
workers_dev = false
preview_urls = false

# Custom Domain: a Cloudflare cria o registro DNS e o certificado do subdomínio (zona charmejoias.com.br)
routes = [
  { pattern = "pagamentos.charmejoias.com.br", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "charme-pagamentos-db"
# identificador do D1 criado em 2026-11-23 (não é segredo)
database_id = "9fc089fc-8c13-4695-9dd2-34adbfc358c0"

# retenção: todo dia às 06:00 UTC apaga itens confirmados (ack) há mais de 90 dias.
# PENDENTE: a API de agendamento exige um subdomínio workers.dev na CONTA (criação única, de nível de conta; a rota workers.dev deste Worker segue desligada).
# Ativar após aprovação, descomentando as duas linhas abaixo e rodando 'wrangler deploy':
# [triggers]
# crons = ["0 6 * * *"]

[observability]
enabled = false
