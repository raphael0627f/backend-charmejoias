name = "charme-pagamentos"
main = "src/index.js"
compatibility_date = "2025-09-01"

# a rota workers.dev fica DESLIGADA: o webhook_url é gravado por link e não pode ser editado, então só o domínio próprio é usado
workers_dev = false
preview_urls = false

# Custom Domain: a Cloudflare cria o registro DNS e o certificado do subdomínio (zona charmejoias.com.br)
routes = [
  { pattern = "pagamentos.charmejoias.com.br", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "charme-pagamentos-db"
# database_id é preenchido após 'wrangler d1 create charme-pagamentos-db' (não é segredo)
database_id = "00000000-0000-0000-0000-000000000000"

# retenção: todo dia às 06:00 UTC apaga itens confirmados (ack) há mais de 90 dias
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = false
