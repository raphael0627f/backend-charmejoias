spring.application.name=app
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/manager_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8080}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

contora.base-url=${CONTORA_BASE_URL:https://fiscal.contora.com.br/api/v1}
# API (meudanfe.com.br) que gera o PDF do DANFE / cancelamento / carta de correção a partir do XML.
danfe.api.base-url=${DANFE_API_BASE_URL:https://api.meudanfe.com.br/v2}
danfe.api.key=${DANFE_API_KEY:}
danfe.api.timeout-segundos=${DANFE_API_TIMEOUT_SEGUNDOS:30}
contora.api-key=${CONTORA_API_KEY:}
contora.default-environment=${CONTORA_DEFAULT_ENVIRONMENT:homologacao}

nfe.status-polling.fixed-delay=30000

app.storage.produtos-imagens-dir=${PRODUTOS_IMAGENS_DIR:./storage/produtos/imagens}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# pasta com os XMLs de NFe autorizada/cancelada/carta de correcao. Fica fora da pasta
# do projeto (um nivel acima) de proposito: sao documentos fiscais que precisam ser
# preservados independente do codigo/deploy da aplicacao
app.storage.nfe-xml-dir=${NFE_XML_DIR:../NFe XML}

# logo usada nos relatorios de consignacao, no mesmo nivel (uma pasta acima do projeto) que a
# pasta de XMLs da NFe - se o arquivo nao existir nesse caminho, o relatorio sai sem logo
app.storage.relatorio-path=${LOGO_RELATORIO_PATH:../relatorio}

app.storage.spc-xml-dir=${SPC_XML_DIR:./storage/spc}

spc.consulta-url-homologacao=${SPC_CONSULTA_URL_HOMOLOGACAO:https://treinamento.spcbrasil.com.br/spc/remoting/ws/consulta/consultaWebService}
spc.consulta-url-producao=${SPC_CONSULTA_URL_PRODUCAO:https://api.spcbrasil.com.br/spc/remoting/ws/consulta/consultaWebService}
spc.insumo-url-homologacao=${SPC_INSUMO_URL_HOMOLOGACAO:https://treinamento.spcbrasil.com.br/spc/remoting/ws/insumo/spc/spcWebService}
spc.insumo-url-producao=${SPC_INSUMO_URL_PRODUCAO:https://api.spcbrasil.com.br/spc/remoting/ws/insumo/spc/spcWebService}
spc.operador=${SPC_OPERADOR:}
spc.senha=${SPC_SENHA:}
spc.default-environment=${SPC_DEFAULT_ENVIRONMENT:homologacao}

jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
auth.token-cleanup.fixed-delay=${AUTH_TOKEN_CLEANUP_DELAY:86400000}

# nunca ligar em DEBUG/TRACE em producao - vaza CPF/dados de cliente nos binds da query e,
# se a app inteira subir com a flag --debug/--trace, o Spring Boot imprime o valor resolvido
# de TODAS as properties no log de startup, incluindo os segredos (jwt.secret, contora.api-key etc)
logging.level.root=INFO
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web.client=WARN