spring.application.name=app
spring.datasource.url=jdbc:postgresql://localhost:5432/manager_erp
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

contora.base-url=${CONTORA_BASE_URL:https://fiscal.contora.com.br/api/v1}
contora.api-key=${CONTORA_API_KEY}
contora.default-environment=${CONTORA_DEFAULT_ENVIRONMENT:homologacao}

nfe.status-polling.fixed-delay=30000

app.storage.produtos-imagens-dir=${PRODUTOS_IMAGENS_DIR:./storage/produtos/imagens}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB