name: Build do backend

# A cada push na main compila o .jar e o publica na release "latest" (sempre sobrescrita).
# O servidor de producao so baixa esse .jar - o codigo-fonte nunca vai para o servidor.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-backend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests clean package

      - name: Publicar na release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/erp-manager.jar \
            --title "Build ${GITHUB_SHA::7}" \
            --notes "Commit ${GITHUB_SHA} em $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --target "${GITHUB_SHA}" \
            --prerelease
